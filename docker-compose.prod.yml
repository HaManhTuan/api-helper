services:
  app:
    image: api-helper-fast:prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.prod
    environment:
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${SERVER_PORT:-8000}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL_DOCKER}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND_DOCKER}
    command: >
      poetry run uvicorn main:app
      --host 0.0.0.0
      --port ${SERVER_PORT:-8000}
      --workers ${UVICORN_WORKERS:-2}
    ports:
      - "${APP_PORT:-8000}:${SERVER_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - .env.prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_prod:/data
    networks:
      - app-network

  celery_worker:
    image: api-helper-fast:prod
    restart: always
    command: poetry run celery -A app.workers.celery_app worker --pool=gevent --concurrency=${CELERY_CONCURRENCY:-50} --loglevel=info
    env_file:
      - .env.prod
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL_DOCKER}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND_DOCKER}
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  app-network:
    driver: bridge
