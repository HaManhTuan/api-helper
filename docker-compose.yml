services:
  app:
    image: api-helper-fast:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_helper
    restart: always
    ports:
      - "${APP_PORT:-8000}:${SERVER_PORT:-8000}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - DEBUG=${DEBUG}
      - SERVER_HOST=${SERVER_HOST}
      - SERVER_PORT=${SERVER_PORT}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL_DOCKER}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND_DOCKER}
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    container_name: fastapi_mvc_db
    restart: always
    ports:
      - "${POSTGRES_PORT_HOST:-5433}:${POSTGRES_PORT:-5432}"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: fastapi_mvc_redis
    restart: always
    ports:
      - "${REDIS_PORT_HOST:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  celery_worker:
    image: api-helper-fast:dev
    container_name: fastapi_mvc_celery_worker
    restart: always
    command: poetry run celery -A app.workers.celery_app worker --pool=gevent --concurrency=200 --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL_DOCKER}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND_DOCKER}
    depends_on:
      - app
      - db
      - redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
